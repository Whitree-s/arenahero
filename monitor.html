<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arena Hero · 实时小地图监控</title>
<style>
  :root {
    --bg:#0b0f17; --panel:#131a28; --line:#243049; --text:#e6ebf5; --muted:#8b97ad; --accent:#4cc2ff;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:13px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  header { padding:8px 16px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header h1 { font-size:13px; margin:0; white-space:nowrap; }
  .live { display:flex; align-items:center; gap:6px; font-weight:700; color:#4cc2ff; font-size:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#4cc2ff; animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  /* 药丸卡片式统计栏（参考截图2风格） */
  .stat-pill { background:rgba(19,26,40,0.9); border:1px solid var(--line); border-radius:10px;
    padding:5px 12px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-width:56px; }
  .stat-pill .val { font-size:15px; font-weight:700; color:var(--text); line-height:1.2;
    font-variant-numeric:tabular-nums; }
  .stat-pill .val.accent { color:var(--accent); }
  .stat-pill .val.green { color:#39d98a; }
  .stat-pill .val.red { color:#ff4d5e; }
  .stat-pill .val.orange { color:#ffb24d; }
  .stat-pill .lbl { font-size:10px; color:var(--muted); line-height:1.2; margin-top:1px; }
  button, .filebtn { background:var(--accent); color:#04121f; border:none; border-radius:6px;
    padding:5px 12px; font-weight:600; cursor:pointer; }
  button.ghost { background:var(--panel); color:var(--text); border:1px solid var(--line); }
  button.ghost.on { background:var(--accent); color:#04121f; border-color:var(--accent); }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--text-secondary); }
  .legend span { display:inline-flex; align-items:center; gap:4px; }
  .legend i { width:11px; height:11px; border-radius:3px; display:inline-block; }
  .swf { background:#0c1119; border:1px solid rgba(255,255,255,0.08);
         background-image:repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.06) 2px, rgba(255,255,255,0.06) 3px); }
  .swe { background:rgba(78,150,235,0.55); border:1px solid rgba(120,180,255,0.6); }
  .swr { background:transparent; border:1px solid rgba(57,217,138,0.9); }
  .zoombar { display:flex; align-items:center; gap:6px; }
  .wrap { display:flex; gap:12px; padding:12px; align-items:stretch; flex:1 1 0; min-height:0; }
  .mapbox { position:relative; background:#070b12; border:1px solid var(--line); border-radius:10px;
    flex:1 1 0; min-width:0; min-height:0; overflow:hidden; }
  canvas { display:block; border-radius:10px; cursor:grab; }
  canvas.grabbing { cursor:grabbing; }
  .col { display:flex; flex-direction:column; gap:10px; min-height:0; }
  .side-left { width:320px; flex:0 0 auto;
    /* 左列：监控设置 / 单位状态(下方窗口占更多高度) */
    display:grid; grid-template-rows:6.5fr 3.5fr; gap:10px; }
  /* 右列：事件过滤(上) + 实时事件流(下，占满剩余空间) */
  .side-right { width:360px; flex:0 0 auto;
    display:grid; grid-template-rows:auto 1fr; gap:10px; min-height:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; min-height:0; }
  /* 监控设置：占满剩余空间，尽量不内滚，超出时仍可滚动 */
  .card.settings-card { overflow:auto; display:flex; flex-direction:column;
    justify-content:flex-start; gap:10px; }
  .card.settings-card .sec { display:flex; flex-direction:column; gap:6px; }
  /* 图例：两列网格 + 色块正常显示 */
  .card.settings-card .sec-legend { display:grid; grid-template-columns:auto auto;
    gap:6px 16px; font-size:11px; color:var(--text-secondary); }
  .card.settings-card .sec-legend span { display:inline-flex; align-items:center; gap:5px; }
  .card.settings-card .sec-legend i { width:11px; height:11px; border-radius:3px; display:inline-block; flex-shrink:0; }
  .card.settings-card .sec-note { line-height:1.8; }
  /* 兵种图标图例 */
  .card.settings-card .sec-units { display:grid; grid-template-columns:auto auto;
    gap:6px 18px; font-size:11px; color:var(--text-secondary); }
  .card.settings-card .sec-units span { display:inline-flex; align-items:center; gap:6px; }
  .card.settings-card .sec-units svg { flex-shrink:0; }
  /* 事件过滤：自适应内容高度，超出时可滚动 */
  .card.filter-card { overflow:auto; display:flex; flex-direction:column; gap:6px; }
  .card.feedcard { flex:1 1 auto; display:flex; flex-direction:column; overflow:hidden; }
  .card h2 { font-size:12px; margin:0 0 8px; color:var(--muted); font-weight:600; letter-spacing:.5px; }
  .row { display:flex; align-items:center; gap:8px; }
  .filters { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; }
  .filters label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .sw { width:10px; height:10px; border-radius:3px; display:inline-block; }
  /* 事件流窗口：超出内容在窗口内滚动，但隐藏滚动条（滚轮/键盘仍可滚动） */
  .feed { flex:1 1 0; min-height:0; overflow:auto; font-size:12px; scrollbar-width:none; -ms-overflow-style:none; }
  .feed::-webkit-scrollbar { width:0; height:0; display:none; }
  .feed .e { padding:3px 6px; border-left:3px solid transparent; border-radius:4px; }
  .tag { display:inline-block; padding:0 6px; border-radius:4px; font-size:11px; color:#04121f; font-weight:700; }
  #drop { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(7,11,18,.92); border-radius:10px; text-align:center; }
  .hint { color:var(--muted); font-size:12px; }
  input[type=range]{ width:100%; }

  /* ===== 单位详细列表面板（参考截图1风格）===== */
  .unitlist { display:flex; flex-direction:column; gap:0; font-size:12px; overflow:auto;
    flex:1 1 auto; min-height:0; }
  .ul-section { border-bottom:1px solid var(--line); }
  .ul-section:last-child { border-bottom:none; }
  .ul-head { display:flex; align-items:center; gap:6px; padding:6px 8px 4px;
    cursor:pointer; user-select:none; background:rgba(255,255,255,0.02);
    transition:background .15s; }
  .ul-head:hover { background:rgba(255,255,255,0.05); }
  .ul-head svg { flex-shrink:0; }
  .ul-head .name { font-weight:600; font-size:12px; color:var(--text); }
  .ul-head .count { margin-left:auto; font-size:11px; color:var(--muted);
    font-variant-numeric:tabular-nums; background:rgba(255,255,255,0.06);
    padding:1px 7px; border-radius:8px; }
  .ul-head .chev { font-size:10px; color:var(--muted); transition:transform .2s;
    display:inline-block; width:12px; text-align:center; }
  .ul-head.collapsed .chev { transform:rotate(-90deg); }
  .ul-body { display:flex; flex-direction:column; padding:2px 0 6px; }
  .ul-body.hidden { display:none; }
  .ul-row { display:grid; grid-template-columns:auto 1fr auto auto auto;
    gap:4px 8px; align-items:center; padding:2px 8px 2px 20px; }
  .ul-row:hover { background:rgba(255,255,255,0.03); }
  .ul-uid { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums;
    font-family:"SF Mono",Menlo,Consolas,monospace; }
  /* HP 条：确保颜色填充可见 */
  .hp-bar { height:8px; background:rgba(255,255,255,0.1); border-radius:4px;
    overflow:hidden; min-width:50px; max-width:80px; position:relative; }
  .hp-fill { height:100%; border-radius:4px; min-width:2px;
    background:#39d98a; transition:width .15s; }
  .hp-fill.low { background:#ff4d5e; }
  .hp-fill.mid { background:#ffb24d; }
  /* 动作标签 */
  .ul-tag { font-size:10px; font-weight:700; color:#04121f; padding:1px 6px;
    border-radius:3px; white-space:nowrap; }
  .ul-pos { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums;
    font-family:"SF Mono",Menlo,Consolas,monospace; text-align:right; }

  /* ===== 地图内滑块设置面板（左上角浮动，点击按钮展开/收起）===== */
  .lp-panel { position:absolute; top:12px; left:12px; z-index:30; width:300px; max-width:calc(100% - 24px); }
  .lp-toggle { background:rgba(19,26,40,0.92); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; backdrop-filter:blur(4px); }
  .lp-toggle:hover { border-color:var(--accent); }
  .lp-toggle .chev { transition:transform .2s ease; display:inline-block; font-size:10px; }
  .lp-toggle.open .chev { transform:rotate(180deg); }
  .lp-body { margin-top:8px; background:rgba(19,26,40,0.96); border:1px solid var(--line);
    border-radius:10px; padding:12px; max-height:calc(100vh - 120px); overflow:auto;
    box-shadow:0 10px 34px rgba(0,0,0,.55); backdrop-filter:blur(6px); }
  .lp-head { display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-bottom:4px; }
  .lp-head b { font-size:12px; color:var(--muted); letter-spacing:.5px; }
  .lp-mode { font-size:11px; color:var(--accent); font-weight:700; }
  .lp-note { font-size:11px; line-height:1.6; color:var(--muted); margin-bottom:8px; }
  .lp-note.warn { color:#ffb24d; }
  .lp-sliders { display:flex; flex-direction:column; gap:9px; }
  .lp-slrow { display:grid; grid-template-columns:1fr auto; gap:2px 8px; align-items:center; }
  .lp-slrow label { grid-column:1/3; display:flex; justify-content:space-between; gap:8px;
    font-size:12px; cursor:pointer; }
  .lp-slrow label .v { color:var(--muted); font-variant-numeric:tabular-nums; }
  .lp-slrow input[type=range]{ grid-column:1/3; }
  .lp-status { font-size:11px; color:var(--muted); margin-top:8px; min-height:14px; }
  .lp-status.ok { color:#39d98a; }
  .lp-status.err { color:#ff6b6b; }
</style>
</head>
<body>
<header>
  <h1>Arena Hero</h1>
  <span class="live"><span class="dot"></span><span id="liveTxt">LIVE</span></span>
  <div class="stat-pill"><span class="val accent" id="sTick">–</span><span class="lbl">tick</span></div>
  <div class="stat-pill"><span class="val" id="sWVR">–</span><span class="lbl">工人/先锋/游侠</span></div>
  <div class="stat-pill"><span class="val green" id="sRes">–</span><span class="lbl">Core 资源</span></div>
  <div class="stat-pill"><span class="val" id="sHp">–</span><span class="lbl">在建数</span></div>
  <div class="stat-pill"><span class="val orange" id="sUnits">–</span><span class="lbl">资源/小时</span></div>
  <div class="stat-pill"><span class="val red" id="sEnemy">–</span><span class="lbl">累计伤害</span></div>
  <div class="stat-pill"><span class="val" id="sUptime">–</span><span class="lbl">本次在线</span></div>
  <span style="flex:1"></span>
  <div class="zoombar">
    <button id="zOut" class="ghost" title="缩小看全局">−</button>
    <span class="hint" id="zTxt">适配</span>
    <button id="zIn" class="ghost" title="放大看细节">+</button>
    <button id="zFit" class="ghost">适配</button>
    <button id="zCore" class="ghost" title="回到 Core（冠军信标侧）位置">定位Core</button>
  </div>
  <label class="filebtn">打开流文件<input id="file" type="file" accept=".jsonl,.json" style="display:none"></label>
</header>

<div class="wrap">
  <div class="mapbox">
    <canvas id="cv" width="720" height="600"></canvas>
    <!-- 地图内滑块设置：左上角浮动按钮，点击展开/收起 -->
    <div class="lp-panel" id="lpPanel">
      <button class="lp-toggle" id="lpToggle"><span class="chev">▾</span>⚙ 参数设置</button>
      <div class="lp-body" id="lpBody" style="display:none">
        <div class="lp-head">
          <b>实时调参</b>
          <span class="lp-mode" id="lpMode">–</span>
        </div>
        <div class="lp-note" id="lpNote">下一 tick 即时生效，无需重启 agent；参数自动记录，刷新页面不丢失。</div>
        <div class="lp-sliders" id="lpSliders"></div>
        <div class="lp-status" id="lpStatus"></div>
        <div class="row" style="margin-top:10px">
          <button id="lpReset" class="ghost" style="font-size:11px;padding:3px 10px">恢复默认</button>
        </div>
      </div>
    </div>
    <div id="drop"><div>未能自动加载分片流。<br/>请通过本地服务器打开本页（需 stream/index.json），<br/>或点右上角「打开流文件」加载单文件。</div></div>
  </div>

  <div class="col side-left">
    <div class="card settings-card">
      <h2>监控设置</h2>
      <div class="sec">
        <div class="row">
          <button id="pause" class="ghost">⏸ 暂停</button>
          <span class="hint" id="upd">等待数据…</span>
        </div>
        <div class="row"><span class="hint" style="width:64px">刷新率</span>
          <input id="rate" type="range" min="200" max="2000" step="100" value="800" style="flex:1">
          <span class="hint" id="rateTxt">800ms</span></div>
      </div>
      <div class="sec">
        <div class="row" style="flex-wrap:wrap; gap:10px 20px">
          <label><input type="checkbox" id="showTrails" checked> 行动轨迹</label>
          <label><input type="checkbox" id="showRes" checked> 资源</label>
          <label><input type="checkbox" id="showMemRes" checked> 记忆资源</label>
          <label><input type="checkbox" id="showExplored" checked> 探索迷雾</label>
          <label><input type="checkbox" id="showTargets" checked> 终点目标</label>
          <label><input type="checkbox" id="showTags" checked> 决策标签</label>
          <label><input type="checkbox" id="showPatrolRings" checked> 巡逻范围</label>
        </div>
      </div>
      <div class="sec sec-legend">
        <span><i style="background:#000;border:1px solid #555"></i>未探索</span>
        <span><i style="background:rgba(118,118,130,0.85)"></i>已探索(记忆)</span>
        <span><i style="background:#408ceb"></i>视野可见</span>
        <span><i style="background:#39d98a"></i>资源(绿)</span>
        <span><i style="background:#ff4d5e"></i>敌方(红)</span>
        <span><i style="background:#ff9628"></i>消失点(橙·兵种形)</span>
        <span><svg width="18" height="18" viewBox="0 0 20 20"><path d="M10,2 L11.8,7.5 L17.6,7.5 L12.9,10.9 L14.7,16.5 L10,13 L5.3,16.5 L7.1,10.9 L2.4,7.5 L8.2,7.5 Z" fill="#ff4d5e" stroke="#fff" stroke-width="1"/></svg>敌核心(红★)</span>
        <span><i style="background:rgba(255,150,40,0.4)"></i>疑似敌核心</span>
      </div>
      <div class="sec sec-units">
        <span><svg width="18" height="18" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="#4cc2ff" stroke="#fff" stroke-width="1"/></svg>工人</span>
        <span><svg width="18" height="18" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" fill="#ff79c6" stroke="#fff" stroke-width="1"/></svg>先锋</span>
        <span><svg width="18" height="18" viewBox="0 0 20 20"><polygon points="10,3 17,17 3,17" fill="#c08bff" stroke="#fff" stroke-width="1"/></svg>游侠</span>
        <span><svg width="18" height="18" viewBox="0 0 20 20"><path d="M10,2 L11.8,7.5 L17.6,7.5 L12.9,10.9 L14.7,16.5 L10,13 L5.3,16.5 L7.1,10.9 L2.4,7.5 L8.2,7.5 Z" fill="#4cc2ff" stroke="#fff" stroke-width="1"/></svg>核心</span>
      </div>
    </div>

    <!-- 单位详细列表面板（可折叠兵种段，每单位显示 HP 条 / 动作标签 / 坐标） -->
    <div class="card" style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0; display:flex; flex-direction:column; overflow:hidden;">
      <h2 style="padding:12px 12px 8px;margin:0;border-bottom:1px solid var(--line);">单位状态</h2>
      <div class="unitlist" id="unitList" style="overflow-y:auto; flex:1 1 0; min-height:0;">
        <div style="padding:10px 12px;color:var(--muted);font-size:12px;text-align:center;">等待数据…</div>
      </div>
    </div>
  </div>

  <div class="col side-right">
    <div class="card filter-card">
      <h2>事件过滤</h2>
      <div class="filters" id="filters"></div>
    </div>

    <div class="card feedcard">
      <h2>实时事件流</h2>
      <div class="feed" id="feed"></div>
    </div>
  </div>
</div>

<script>
const TYPE_COLORS = { worker:"#4cc2ff", vanguard:"#ff79c6", ranger:"#c08bff", core:"#4cc2ff" };
const EV_META = {
  harvest:{label:"采集",color:"#39d98a"}, HARVEST_SUCCEEDED:{label:"采集成功",color:"#1f9d57"},
  deposit_move:{label:"回核心交付",color:"#4cc2ff"}, DEPOSIT_SUCCEEDED:{label:"交付成功",color:"#2b7fd4"},
  explore:{label:"探索",color:"#2ee6c9"}, encounter_enemy:{label:"遭遇敌人",color:"#ff5d6c"},
  attacked:{label:"被攻击",color:"#ff2e4d"}, attack:{label:"攻击敌人",color:"#ff8a3d"},
  flee:{label:"撤退",color:"#e85ad8"},
  death:{label:"阵亡",color:"#ff1a2c"},
};
const ORDER = ["harvest","HARVEST_SUCCEEDED","deposit_move","DEPOSIT_SUCCEEDED","explore","encounter_enemy","attacked","attack","death","flee"];

// arena-evolve 每单位决策标签（HeuristicStrategy._dbg 写入 _decisions[uid].tag）
// 的中文映射：monitor 在单位上方显示「此刻在做什么」。未列出的标签原样显示，不丢信息。
const TAG_CN = {
  wait:"待命", manual:"手动", siege_block:"堵路", self_destruct:"自毁",
  flee:"撤退", flee_memory:"记忆撤退", hold_full:"满仓待", return_core:"回核心",
  deposit:"存放", goto_near:"就近采", goto_resource:"采集", wait_resource:"等资源",
  block:"堵路", harass:"骚扰工", revisit:"回访", scout:"侦察",
  osc_break:"脱困", osc_wait:"振荡等", yield_core:"让核心", exit_cave:"出洞",
  sweep:"扫荡", siege_intercept_vanguard:"拦截", siege_vanguard:"回防", siege_advance_vanguard:"反推", attack:"攻击",
  raid:"突袭", explore:"探索", park:"驻守", corner_block:"卡角", push_core:"推核心",
  push_greedy:"推进", retreat_low_hp:"低血退",
  ranger_disengage:"脱离", siege_ranger:"回防游", siege_advance_ranger:"反推游", home_ranger:"驻守游", home_vanguard:"守家", vault_ranger:"金库游",
  // 支援标签
  support_sweep:"支援扫荡", support_approach:"支援接敌", support_cover:"支援掩护",
  support_shoot:"支援射击", support_move_ranger:"支援移动", support_reinforce:"增援",
  support_stuck:"支援受阻",
  shoot_stationary:"射击", shoot:"射击", patrol:"巡逻", kite:"风筝", track:"追踪",
  ranger_cover:"掩射", ranger_angle:"走位", ranger_advance:"推进",
  ranger_cover_advance:"掩进", firing_advance:"推进",
  siege_ranger_cover:"回防掩射", siege_ranger_angle:"回防走位",
  siege_ranger_advance:"回防推进", siege_ranger_cover_advance:"回防掩进",
  vanguard_cover:"掩射", vanguard_angle:"走位", vanguard_advance:"推进",
  vanguard_cover_advance:"掩进",
  spread:"散开", hold_full:"满格等", self_destruct:"自毁",
  return_core:"回核心", deposit:"交付", wait_resource:"等资源",
  goto_near:"去资源点",
};
function tagCN(tag){
  if(!tag) return "";
  return TAG_CN[tag] || tag;   // 未知标签原样回退，避免信息丢失
}
const INDEX_URL = "stream/index.json";
const SHARD_GLOB = "stream/shard_";
const MAP_URL = "stream/map.json";
const ENEMY_MARKS_URL = "stream/enemy_marks.json";
const MAXTICKS = 2400;

// 取数基址：只有从地图服务器(8742)打开时才用相对路径；
// 用 file:// 或预览面板(其它端口)打开时自动改用本地服务器绝对地址，
// 否则 fetch 会被 CORS 拦截 → 分片/快照取不到 → 整片黑。
const AH_SERVER = "http://127.0.0.1:8742";
const AH_BASE = (location.protocol === "file:" || (location.host && location.port !== "8742")) ? AH_SERVER + "/" : "";
function ah_url(u){ return AH_BASE + u; }

// 地图层永久快照（障碍/资源记忆/已探索逐格）。与分片流解耦，不会被环形缓冲淘汰。
let MAPBASE = null;
// 敌方敌情标注（消失点 ! + 三角定位核心区），每 tick 更新的小文件
let ENEMY_MARKS = null;
let TICKS=[], BOUNDS=null, BASE_SCALE=1, PAN={x:0,y:0}, paused=false, lastUpdate=0;
let zoom=1, autoFit=true, trackCore=false;
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");

// 地图画布随容器(=浏览器剩余高度)自适应：按 devicePixelRatio 设内部分辨率保证清晰，
// 显示尺寸填充满 mapbox。窗口缩放时重新适配并重算取景。
function fitCanvas(){
  const box=cv.parentElement;
  const w=box.clientWidth, h=box.clientHeight;
  if(w<=0 || h<=0) return;
  const dpr=window.devicePixelRatio||1;
  const bw=Math.round(w*dpr), bh=Math.round(h*dpr);
  if(cv.width!==bw || cv.height!==bh){
    cv.width=bw; cv.height=bh;
    cv.style.width=w+"px"; cv.style.height=h+"px";
    computeBounds(); draw();
  }
}
window.addEventListener("resize", fitCanvas);

function hue(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h%360; }
function unitColor(id){ return `hsl(${hue(id)},70%,62%)`; }

// 单位外形配色：敌方统一红色；我方按兵种用队色（外形相同，仅颜色区分敌我）。
// 绿色专留给资源，故我方不使用绿色：工人蓝 / 先锋橙 / 游侠紫 / 核心蓝。
const ENEMY_COLOR = "#ff4d5e";
const FRIEND_COLORS = { WORKER:"#4cc2ff", VANGUARD:"#ff79c6", RANGER:"#c08bff", CORE:"#4cc2ff" };
function friendColor(type){ return FRIEND_COLORS[(type||"").toUpperCase()] || "#4cc2ff"; }
// 按兵种画外形（放大到几乎充满单元格）：worker=圆 / vanguard=方 / ranger=三角
function drawUnitShape(cx, cy, v, type, color, stroke){
  const s = Math.max(1.5, v*0.47);   // 半格尺寸：图标放大到接近填满整格
  const t = (type||"").toUpperCase();
  ctx.fillStyle = color;
  ctx.strokeStyle = stroke || "#fff";
  ctx.lineWidth = Math.max(1, v*0.06);
  if(t==="VANGUARD"){
    ctx.fillRect(cx-s, cy-s, s*2, s*2);
    if(stroke) ctx.strokeRect(cx-s, cy-s, s*2, s*2);
  } else if(t==="RANGER"){
    // 三角：顶点在上方、底边占满整格宽度，充满单元格
    ctx.beginPath();
    ctx.moveTo(cx, cy-s);
    ctx.lineTo(cx+s, cy+s);
    ctx.lineTo(cx-s, cy+s);
    ctx.closePath(); ctx.fill();
    if(stroke) ctx.stroke();
  } else {            // WORKER / 默认 = 圆
    ctx.beginPath(); ctx.arc(cx, cy, s, 0, 7); ctx.fill();
    if(stroke) ctx.stroke();
  }
}

// 核心：五角星，按敌我关系上色（我方蓝/敌方红/消失橙）
function drawCoreStar(cx, cy, v, color, stroke){
  const r=Math.max(3,v*0.55);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(-Math.PI/2);
  ctx.fillStyle=color; ctx.strokeStyle=stroke||"#fff"; ctx.lineWidth=1.2;
  ctx.beginPath();
  for(let i=0;i<10;i++){ const ang=i*Math.PI*2/10, rad=i%2===0?r:r*0.38;
    if(i===0)ctx.moveTo(Math.cos(ang)*rad,Math.sin(ang)*rad); else ctx.lineTo(Math.cos(ang)*rad,Math.sin(ang)*rad); }
  ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
}

function computeBounds(){
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  const acc=p=>{ if(!p)return; minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]); };
  const fw = autoFit ? 120 : (zoom<0.6 ? 320 : 60);
  const recent=TICKS.slice(-fw);
  recent.forEach(t=>{
    if(t.core) acc(t.core.pos);
    t.units.forEach(u=>acc(u.pos));
    t.enemies.forEach(e=>acc(e.pos));
    (t.obstacles||[]).forEach(acc);
    (t.resources_cells||[]).forEach(acc);
  });
  // 分片流未就绪时，用地图快照(MAPBASE)撑起视图范围，避免整片黑
  if(!recent.length && MAPBASE){
    if(MAPBASE.core) acc(MAPBASE.core);
    (MAPBASE.obstacles||[]).forEach(acc);
    (MAPBASE.explored_cells||[]).forEach(acc);
  }
  if(minX>maxX){minX=-10;maxX=10;minY=-10;maxY=10;}
  const pad=4; minX-=pad;maxX+=pad;minY-=pad;maxY+=pad;
  BOUNDS={minX,maxX,minY,maxY};
  const sxr=cv.width/(maxX-minX||1), syr=cv.height/(maxY-minY||1);
  BASE_SCALE=Math.min(sxr,syr)*0.92;
  // 自动取景时以最近一帧的单位质心为视图中心；手动模式(拖动/缩放)不覆盖 PAN，避免拖动后回弹
  const last=TICKS[TICKS.length-1];
  if(autoFit && last){
    let cx=0,cy=0,n=0;
    if(last.core){cx+=last.core.pos[0];cy+=last.core.pos[1];n++;}
    last.units.forEach(u=>{cx+=u.pos[0];cy+=u.pos[1];n++;});
    if(n){PAN.x=cx/n; PAN.y=cy/n;}
  }
  // 跟随 Core：锁定视图中心到最新 Core 坐标（Core 会随信标迁移）
  if(trackCore && last && last.core){ PAN.x=last.core.pos[0]; PAN.y=last.core.pos[1]; }
}
function viewScale(){ return BASE_SCALE * (autoFit?1:zoom); }
function sx(x){ const c=autoFit?(BOUNDS.minX+BOUNDS.maxX)/2:PAN.x; return cv.width/2+(x-c)*viewScale(); }
function sy(y){ const c=autoFit?(BOUNDS.minY+BOUNDS.maxY)/2:PAN.y; return cv.height/2+(y-c)*viewScale(); }
// 当前 tick 的真实视野（用于把"蓝=可见"与"灰=已探索记忆"区分开）。
// 规则：私有视野 = 所有存活己方对象各自视野(曼哈顿半径)的并集；
// 障碍遮挡走整数直线(类 Bresenham)：障碍格本身可见，它后面看不见；
// 射线正好从两格共用的角穿过时两侧都算经过，任一侧有障碍即挡住。
const _VIS={worker:3, vanguard:4, ranger:5, core:5};
function losVisible(ox,oy,tx,ty,obsSet){
  // 目标格 (tx,ty) 是否从 (ox,oy) 可见（考虑障碍遮挡）。
  // 标准 Bresenham：按主轴(较长轴)推进，每轮只走一格、误差收敛，必然终止。
  // 旧实现每轮无条件 x+=sxstep，只适合水平线；陡线(ady>adx)会越过目标点发散 → 死循环 → 页面空白。
  if(ox===tx && oy===ty) return true;
  const dx=Math.abs(tx-ox), dy=Math.abs(ty-oy);
  const sxstep = tx>ox?1:(tx<ox?-1:0);
  const systep = ty>oy?1:(ty<oy?-1:0);
  let x=ox, y=oy, err = dx - dy;
  while(true){
    if(err > 0){ x += sxstep; err -= dy; }
    else        { y += systep; err += dx; }
    if(x===tx && y===ty) return true;        // 到达目标：即便目标是障碍也可见
    if(obsSet.has(x+","+y)) return false;     // 中间障碍挡住其后视线
  }
}
let _visCache = { tick:-1, set:null, obsKey:"" };
function computeVisible(t, obs){
  // 按 tick 缓存（动画帧很多，tick 不变时直接复用）。obs 用于遮挡。
  const obsKey = (obs&&obs.length)||0;
  if(_visCache.tick===t.tick && _visCache.set && _visCache.obsKey===obsKey) return _visCache.set;
  const obsSet = new Set((obs||[]).map(p=>p[0]+","+p[1]));
  const vis = new Set();
  const add=(cx,cy,r)=>{
    for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){
      if(Math.abs(dx)+Math.abs(dy)>r) continue;
      if(losVisible(cx,cy,cx+dx,cy+dy,obsSet)) vis.add((cx+dx)+","+(cy+dy));
    }
  };
  (t.units||[]).forEach(u=>add(u.pos[0], u.pos[1], _VIS[(u.type||"").toUpperCase()]||3));
  if(t.core) add(t.core.pos[0], t.core.pos[1], 5);
  _visCache = { tick:t.tick, set:vis, obsKey };
  return vis;
}
// 低缩放降级：判断某 32 格扇区是否含可见格（决定涂蓝还是涂灰）
function sectorHasVisible(k, vis, ss){
  const a=k.split(","); const bx=+a[0]*ss, by=+a[1]*ss;
  for(let dx=0;dx<ss;dx++)for(let dy=0;dy<ss;dy++) if(vis.has((bx+dx)+","+(by+dy))) return true;
  return false;
}

function getFogPat(){
  // 未探索迷雾：深色底 + 浅斜纹，和已探索的亮蓝块形成强对比（战争迷雾风格）
  if(getFogPat._p) return getFogPat._p;
  const c=document.createElement("canvas"); c.width=8; c.height=8;
  const g=c.getContext("2d");
  g.fillStyle="#0c1119"; g.fillRect(0,0,8,8);
  g.strokeStyle="rgba(255,255,255,0.045)"; g.lineWidth=1;
  g.beginPath(); g.moveTo(-1,9); g.lineTo(9,-1); g.moveTo(3,9); g.lineTo(9,3); g.stroke();
  getFogPat._p=ctx.createPattern(c,"repeat");
  return getFogPat._p;
}
function draw(){
  let t;
  if(TICKS.length) t=TICKS[TICKS.length-1];
  // 分片流为空时回退到地图快照：仍画出已探索区/障碍/核心/信标，避免整片纯黑
  else if(MAPBASE) t={core: MAPBASE.core?{pos:MAPBASE.core}:null, obstacles:MAPBASE.obstacles||[], units:[], enemies:[], resources_cells:[], events:[]};
  if(!t) return;
  ctx.clearRect(0,0,cv.width,cv.height);
  // 未探索 = 纯黑底；已探索 = 浅蓝逐格覆盖 + 白色描边（清晰边界）。
  const v=viewScale();
  const fogOn = document.getElementById("showExplored").checked && MAPBASE && MAPBASE.explored_cells && MAPBASE.explored_cells.length;
  // 障碍来源优先级（提前解析，供下方视野遮挡计算使用）：永久快照 ∪ 当前帧
  let obs=t.obstacles;
  if(!obs){ for(let i=TICKS.length-1;i>=0;i--){ if(TICKS[i].obstacles){obs=TICKS[i].obstacles;break;} } }
  if(MAPBASE && MAPBASE.obstacles && MAPBASE.obstacles.length){
    if(!obs || MAPBASE.obstacles.length>=obs.length) obs=MAPBASE.obstacles;
  }
  ctx.fillStyle = "#000000";            // 未探索区域：纯黑填充
  ctx.fillRect(0,0,cv.width,cv.height);
  // （已移除全局网格线——它会在已探索区边缘形成明显的方形白框轮廓）
  // 战争迷雾三层：黑=未探索，灰=已探索(记忆)，蓝=当前视野可见。每格白边。
  if(fogOn){
    const cells=MAPBASE.explored_cells;
    const vis=computeVisible(t, obs);        // 当前 tick 真实视野（含障碍遮挡，蓝）
    // 默认逐格描白边；仅极端缩放 + 超多格子时退化为扇区填充（不描整块白边，避免大方块白框）。
    const lowDetail = v<0.5 && cells.length>20000;
    if(lowDetail){
      const ss=MAPBASE.sector_size||32;
      const seen=new Set();
      cells.forEach(p=>{
        const k=Math.floor(p[0]/ss)+","+Math.floor(p[1]/ss);
        if(seen.has(k)) return; seen.add(k);
        const x0=sx(Math.floor(p[0]/ss)*ss), y0=sy(Math.floor(p[1]/ss)*ss), w=ss*v;
        const blue = sectorHasVisible(k, vis, ss);
        ctx.fillStyle = blue ? "rgba(64,140,235,0.6)" : "rgba(118,118,130,0.55)";
        ctx.fillRect(x0,y0,w,w);   // 仅填充，不描白边
      });
    }else{
      ctx.strokeStyle="rgba(255,255,255,0.13)"; ctx.lineWidth=1;
      cells.forEach(p=>{
        const key=p[0]+","+p[1];
        ctx.fillStyle = vis.has(key) ? "rgba(64,140,235,0.62)" : "rgba(118,118,130,0.55)";
        ctx.fillRect(sx(p[0]), sy(p[1]), v, v);
        ctx.strokeRect(sx(p[0]), sy(p[1]), v, v);   // 每格淡白边
      });
    }
  }
  // （已移除放大时的全覆盖白网格——会在已探索区边缘形成方形白框）
  // （障碍已在上文解析，供视野遮挡使用）
  // 障碍(石头)：在格子内居中的实心方块（不超出格子）
  if(obs){ ctx.fillStyle="#9aa7bd"; obs.forEach(p=>{ const x=sx(p[0])+v/2, y=sy(p[1])+v/2, r=Math.max(1.5, v*0.42); ctx.fillRect(x-r, y-r, r*2, r*2); }); }
  if(document.getElementById("showRes").checked){
    // 当前视野内资源：亮绿实心圆，格子内、带白边
    (t.resources_cells||[]).forEach(p=>{ const x=sx(p[0])+v/2, y=sy(p[1])+v/2, r=Math.max(2, v*0.34);
      ctx.fillStyle="rgba(57,217,138,0.95)"; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
      ctx.strokeStyle="#fff"; ctx.lineWidth=1; ctx.stroke(); });
  }
  // 记忆资源：已探索并持久化、但当前不在视野内的资源（蓝钻，格子内、带白边）。
  // 后端 MapMemory.resource_memory 在看到资源时写入 map.json、采完/到访无资源时清除。
  // 前端防御过滤：只渲染位于 explored_cells 内的记忆资源（避免未探索区出现幽灵图标）。
  if(document.getElementById("showMemRes").checked && MAPBASE && MAPBASE.resource_memory){
    const live = new Set((t.resources_cells||[]).map(p=>p[0]+","+p[1]));
    // 构建 explored_cells 快速查找集（迷雾开启时才有意义）
    const fogOn = document.getElementById("showExplored").checked;
    const exploredSet = (fogOn && MAPBASE.explored_cells)
      ? new Set(MAPBASE.explored_cells.map(p=>p[0]+","+p[1])) : null;
    MAPBASE.resource_memory.forEach(r=>{
      const key=r[0]+","+r[1];
      if(live.has(key)) return;            // 当前可见的用绿点画了，避免重叠
      // 防御性过滤：不在已探索区域内的记忆资源不渲染（数据残留兜底）
      if(exploredSet && !exploredSet.has(key)) return;
      const x=sx(r[0])+v/2, y=sy(r[1])+v/2, s=Math.max(2.5, v*0.4);
      ctx.fillStyle="rgba(57,217,138,0.95)";   // 记忆资源也用绿色（空心菱形，区别于当前视野的实心绿点）
      ctx.beginPath(); ctx.moveTo(x,y-s); ctx.lineTo(x+s,y); ctx.lineTo(x,y+s); ctx.lineTo(x-s,y); ctx.closePath(); ctx.fill();
      ctx.strokeStyle="#fff"; ctx.lineWidth=1; ctx.stroke();
    });
  }
  if(document.getElementById("showTrails").checked){
    const fw=autoFit?80:(zoom<0.6?260:40);
    const recent=TICKS.slice(-fw);
    const byId={};
    recent.forEach(tt=>tt.units.forEach(u=>{(byId[u.id]||=[]).push(u.pos);}));
    Object.keys(byId).forEach(id=>{
      const pts=byId[id]; if(pts.length<2) return;
      ctx.strokeStyle=unitColor(id); ctx.globalAlpha=0.45; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(sx(pts[0][0])+v/2,sy(pts[0][1])+v/2);
      for(let i=1;i<pts.length;i++) ctx.lineTo(sx(pts[i][0])+v/2,sy(pts[i][1])+v/2);
      ctx.stroke(); ctx.globalAlpha=1;
    });
  }
  // 我方 Core：蓝色五角星
  if(t.core){ drawCoreStar(sx(t.core.pos[0])+v/2, sy(t.core.pos[1])+v/2, v, "#4cc2ff", "#fff"); }
  // 巡逻范围参考圈：以 Core 为中心的三层巡逻半径（外36×36/中20×20/内10×10），蓝色系（绿仅资源）
  if(document.getElementById("showPatrolRings").checked && t.core){
    const ccx=sx(t.core.pos[0])+v/2, ccy=sy(t.core.pos[1])+v/2;
    const rings=[[18,"rgba(120,170,255,0.45)","外巡逻36"],[10,"rgba(76,194,255,0.45)","中巡逻20"],[5,"rgba(160,210,255,0.55)","内巡逻10"]];
    ctx.save(); ctx.setLineDash([6,6]); ctx.lineWidth=1.4;
    rings.forEach(([r,col,label])=>{
      const rad=r*v;
      ctx.strokeStyle=col;
      ctx.beginPath(); ctx.arc(ccx,ccy,rad,0,7); ctx.stroke();
      ctx.fillStyle=col; ctx.font="bold 10px sans-serif"; ctx.textAlign="center";
      ctx.fillText(label, ccx, ccy-rad-3);
    });
    ctx.setLineDash([]); ctx.restore();
  }
  // 禁止/危险区域（战斗单位阵亡触发）：禁止区红虚线圆(探索单位绕行)、危险区橙实线圆(全员清场)
  if(t.danger_zones && t.danger_zones.length){
    ctx.save(); ctx.lineWidth=1.6; ctx.font="bold 10px sans-serif"; ctx.textAlign="center";
    t.danger_zones.forEach(z=>{
      const cx=sx(z.center[0])+v/2, cy=sy(z.center[1])+v/2, rad=Math.max(3, z.radius*v);
      if(z.state==="forbidden"){ ctx.strokeStyle="rgba(255,80,80,0.9)"; ctx.setLineDash([5,4]); }
      else { ctx.strokeStyle="rgba(255,170,40,0.95)"; ctx.setLineDash([]); }
      ctx.beginPath(); ctx.arc(cx,cy,rad,0,7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = z.state==="forbidden" ? "rgba(255,80,80,0.95)" : "rgba(255,170,40,1)";
      ctx.fillText(z.state==="forbidden" ? "禁止区" : "危险区("+z.recorded+")", cx, cy-rad-3);
    });
    ctx.restore();
  }
  // 死亡标记（红色❌，持续约 60 tick 后淡出消失）
  {
    const DEATH_TTL = 60; // 存活 tick 数
    const curTick = t.tick || 0;
    // 收集最近所有帧的死亡事件（跨帧累积显示）
    const allDeaths = [];
    TICKS.slice(-DEATH_TTL).forEach(tt=>{
      if(tt.death_events) tt.death_events.forEach(d=>{ d._srcTick=tt.tick; allDeaths.push(d); });
    });
    allDeaths.forEach(d=>{
      const age = curTick - (d._srcTick||curTick);
      if(age<0||age>DEATH_TTL) return;
      const alpha = Math.max(0.15, 1 - age/DEATH_TTL); // 线性淡出
      const x=sx(d.pos[0])+v/2, y=sy(d.pos[1])+v/2;
      ctx.save();
      ctx.globalAlpha = alpha;
      // 红色❌背景圆
      ctx.fillStyle = "rgba(255,26,44,"+alpha+")";
      ctx.beginPath(); ctx.arc(x,y,v*0.45,0,7); ctx.fill();
      // ❌符号
      ctx.strokeStyle="#fff"; ctx.lineWidth=Math.max(1.5, v*0.08);
      const s=v*0.28;
      ctx.beginPath(); ctx.moveTo(x-s,y-s); ctx.lineTo(x+s,y+s); ctx.moveTo(x+s,y-s); ctx.lineTo(x-s,y+s); ctx.stroke();
      // 兵种标签
      const ut_cn = {"VANGUARD":"先锋","RANGER":"游侠"}[d.unit_type]||"";
      if(ut_cn){
        ctx.fillStyle="rgba(255,255,255,"+(alpha*0.9)+")";
        ctx.font="bold "+Math.max(8, v*0.22)+"px sans-serif"; ctx.textAlign="center";
        ctx.fillText(ut_cn, x, y+v*0.65);
      }
      ctx.restore();
    });
  }
  // 冠军信标（arena_hero 中世界坐标固定 (0,0)，由帧数据驱动；缺省回退 (0,0)）
  { const bpos = (t.beacon && Array.isArray(t.beacon)) ? t.beacon : [0,0];
    const bx=sx(bpos[0])+v/2,by=sy(bpos[1])+v/2; const pr=Math.max(3,v*0.85);
    ctx.globalAlpha=0.25+0.2*Math.abs(Math.sin(Date.now()/400)); ctx.fillStyle="#ffe14c";
    ctx.beginPath(); ctx.arc(bx,by,pr*1.4,0,7); ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle="#ffe14c"; ctx.strokeStyle="#7a5b00"; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(bx,by-pr); ctx.lineTo(bx+pr,by); ctx.lineTo(bx,by+pr); ctx.lineTo(bx-pr,by); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#3a2a00"; ctx.font="bold 11px sans-serif"; ctx.textAlign="center"; ctx.fillText("B",bx,by+4); }
  // 敌方单位：红，按兵种画外形（worker圆/vanguard方/ranger三角）
  t.enemies.forEach(e=>{ const x=sx(e.pos[0])+v/2,y=sy(e.pos[1])+v/2;
    // 敌方核心(type=ENEMY_CORE)画红色五角星，而非落入默认圆形分支
    if((e.type||"").toUpperCase()==="ENEMY_CORE"){ drawCoreStar(x,y,v,"#ff4d5e","#fff"); return; }
    drawUnitShape(x, y, v, e.type, ENEMY_COLOR, "#fff"); });
  // 我方单位终点目标：队色虚线连接单位→目标格 + 目标格队色方向箭头（开关 showTargets）
  if(document.getElementById("showTargets").checked){
    t.units.forEach(u=>{
      if((u.type||"").toUpperCase()==="CORE") return;
      if(!u.target) return;
      const x=sx(u.pos[0])+v/2, y=sy(u.pos[1])+v/2;
      const tx=sx(u.target[0])+v/2, ty=sy(u.target[1])+v/2;
      const col = friendColor(u.type);
      ctx.save();
      ctx.strokeStyle=col; ctx.globalAlpha=0.85; ctx.lineWidth=1.4;
      ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(tx,ty); ctx.stroke();
      ctx.setLineDash([]);
      // 目标格：队色小箭头，指向行进方向（单位→目标）
      const tdx=tx-x, tdy=ty-y, tl=Math.hypot(tdx,tdy);
      if(tl>0.5){
        const ux=tdx/tl, uy=tdy/tl, ps=Math.max(4, v*0.55);
        const px=-uy, py=ux;
        ctx.fillStyle=col;
        ctx.beginPath();
        ctx.moveTo(tx+ux*ps, ty+uy*ps);
        ctx.lineTo(tx-ux*ps*0.2+px*ps*0.55, ty-uy*ps*0.2+py*ps*0.55);
        ctx.lineTo(tx-ux*ps*0.2-px*ps*0.55, ty-uy*ps*0.2-py*ps*0.55);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    });
  }
  // 我方单位：队色，外形与敌方一致（仅颜色区分敌我）；带资源的工人描白边
  t.units.forEach(u=>{ if((u.type||"").toUpperCase()==="CORE")return; const x=sx(u.pos[0])+v/2,y=sy(u.pos[1])+v/2;
    const col = friendColor(u.type);
    drawUnitShape(x, y, v, u.type, col, u.cargo>0 ? "#fff" : null);
    // 移动方向箭头：队色小三角，指向本 tick 实际移动的那一格
    if(u.dir){ const dx=u.dir[0], dy=u.dir[1], dl=Math.hypot(dx,dy);
      if(dl>0){ const ux=dx/dl, uy=dy/dl, s=Math.max(3, v*0.40);
        const ax=x+ux*v*0.62, ay=y+uy*v*0.62;
        const px=-uy, py=ux;
        ctx.fillStyle=col;
        ctx.beginPath();
        ctx.moveTo(ax+ux*s, ay+uy*s);
        ctx.lineTo(ax+px*s*0.7, ay+py*s*0.7);
        ctx.lineTo(ax-px*s*0.7, ay-py*s*0.7);
        ctx.closePath(); ctx.fill();
      }
    }
  });
  // 我方单位决策标签：队色小字画在单位上方（开关 showTags）。深色描边保证
  // 在任意底色上都可读；低缩放时字号收敛避免糊成一片。
  if(document.getElementById("showTags").checked){
    t.units.forEach(u=>{
      if((u.type||"").toUpperCase()==="CORE") return;
      const tag = u.tag;
      if(!tag) return;
      const cn = tagCN(tag);
      if(!cn) return;
      const x=sx(u.pos[0])+v/2, y=sy(u.pos[1])+v/2;
      const fs = Math.max(10, Math.min(15, v*0.40));
      ctx.save();
      ctx.font = "bold "+fs+"px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      // 深色描边底 + 队色填充
      ctx.lineWidth = Math.max(2.5, fs*0.32);
      ctx.strokeStyle = "rgba(7,11,18,0.9)";
      ctx.strokeText(cn, x, y - v*0.55);
      ctx.fillStyle = friendColor(u.type);
      ctx.fillText(cn, x, y - v*0.55);
      ctx.restore();
    });
  }
  // 敌方敌情标注（来自 stream/enemy_marks.json）
  if(ENEMY_MARKS){
    // 三角定位的敌方核心大致区域：红色五角星 + 红色不确定环
    (ENEMY_MARKS.enemy_core_zones||[]).forEach(z=>{
      const xc=sx(z.pos[0])+v/2, yc=sy(z.pos[1])+v/2, R=z.radius*v;
      ctx.fillStyle="rgba(255,77,94,0.16)";
      ctx.beginPath(); ctx.arc(xc, yc, R, 0, 7); ctx.fill();
      ctx.strokeStyle="rgba(255,77,94,0.6)"; ctx.lineWidth=1.5; ctx.stroke();
      drawCoreStar(xc, yc, v, "#ff4d5e", "#fff");
      ctx.fillStyle="rgba(255,110,120,0.95)"; ctx.font="bold 10px sans-serif"; ctx.textAlign="center";
      ctx.fillText("敌核心", xc, yc-R-3);
    });
    // 敌方消失点：橙色对应兵种图标（圆=工人/方=先锋/三角=游侠/五角星=核心）。
    // 到达该格且周围无敌人后由后端取消（见后端 EnemyMemory.clear_resolved_contacts）。
    (ENEMY_MARKS.enemy_lost||[]).forEach(lc=>{
      const x=sx(lc.pos[0])+v/2, y=sy(lc.pos[1])+v/2;
      if((lc.unit_type||"").toUpperCase()==="CORE") drawCoreStar(x, y, v, "#ff9628", "#fff");
      else drawUnitShape(x, y, v, lc.unit_type, "#ff9628", "#fff");
    });
  }
}

function renderStats(){
  const t = TICKS.length ? TICKS[TICKS.length-1] : null;
  const startTime = window._startTime || (window._startTime=Date.now());
  if(!t){
    if(MAPBASE){
      document.getElementById("sTick").textContent=MAPBASE.tick;
      document.getElementById("sRes").textContent="?";
      document.getElementById("sHp").textContent="-";
      document.getElementById("sUnits").textContent="-";
      document.getElementById("sEnemy").textContent="-";
    }
    document.getElementById("sWVR").textContent="–";
    document.getElementById("sUptime").textContent="–";
    document.getElementById("unitList").innerHTML='<div style="padding:10px 12px;color:var(--muted);font-size:12px;text-align:center;">等待数据…</div>';
    return;
  }
  // ── 头部药丸卡片 ──
  document.getElementById("sTick").textContent=t.tick;
  // 资源：当前/上限（上限 = 人口×5，v0.14 规则）
  const pop = t.population || (t.units?t.units.length:0);
  const resCap = Math.max(pop * 5, 5);
  const curRes = t.resources != null ? t.resources : "?";
  document.getElementById("sRes").textContent = typeof curRes === "number" ? curRes+"/"+resCap : curRes;
  // 核心 HP/盾
  if(t.core){
    document.getElementById("sHp").textContent = t.core.hp+"/"+(t.core.shield||"?");
  } else {
    document.getElementById("sHp").textContent="–";
  }
  // 我方单位数
  const myUnits = (t.units||[]).filter(u=>(u.type||"").toUpperCase()!=="CORE");
  document.getElementById("sUnits").textContent=myUnits.length;
  // 敌人数
  document.getElementById("sEnemy").textContent=(t.enemies||[]).length;
  // 工人/先锋/游侠 计数
  const uc = t.unit_counts||{};
  const w = uc.worker!=null?uc.worker:myUnits.filter(u=>(u.type||"").toUpperCase()==="WORKER").length;
  const v = uc.vanguard!=null?uc.vanguard:myUnits.filter(u=>(u.type||"").toUpperCase()==="VANGUARD").length;
  const r = uc.ranger!=null?uc.ranger:myUnits.filter(u=>(u.type||"").toUpperCase()==="RANGER").length;
  document.getElementById("sWVR").textContent=w+"/"+v+"/"+r;
  // 在线时长
  const secs = Math.floor((Date.now()-startTime)/1000);
  if(secs < 3600) document.getElementById("sUptime").textContent=Math.floor(secs/60)+"m"+(secs%60)+"s";
  else { const h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60); document.getElementById("sUptime").textContent=h+"h"+m+"m"; }

  // ── 单位详细列表 ──
  renderUnitList(t);
}

  if(!tag) return "rgba(139,151,173,0.25)";
  return TAG_COLORS[tag] || "rgba(139,151,173,0.25)";
}

function renderUnitList(t){
  const box = document.getElementById("unitList");
  const units = t.units || [];
  const core = t.core;
  // 按兵种分组
  const byType = { WORKER:[], VANGUARD:[], RANGER:[] };
  units.forEach(u=>{
    const ut = (u.type||"").toUpperCase();
    if(byType[ut]) byType[ut].push(u);
  });

  // 兵种图标 SVG（复用已有配色）
  const ICONS = {
    CORE: '<svg width="16" height="16" viewBox="0 0 20 20"><path d="M10,2 L11.8,7.5 L17.6,7.5 L12.9,10.9 L14.7,16.5 L10,13 L5.3,16.5 L7.1,10.9 L2.4,7.5 L8.2,7.5 Z" fill="#4cc2ff" stroke="#fff" stroke-width="1"/></svg>',
    WORKER: '<svg width="14" height="14" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="#4cc2ff" stroke="#fff" stroke-width="1"/></svg>',
    VANGUARD: '<svg width="14" height="14" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" fill="#ff79c6" stroke="#fff" stroke-width="1"/></svg>',
    RANGER: '<svg width="14" height="14" viewBox="0 0 20 20"><polygon points="10,3 17,17 3,17" fill="#c08bff" stroke="#fff" stroke-width="1"/></svg>'
  };

  // HP 条颜色判定（内联用，确保颜色一定渲染）
  function hpClass(hp, max){ return hp/max <= 0.33 ? "low" : hp/max <= 0.66 ? "mid" : ""; }
  function hpColor(hp, max){ return hp/max <= 0.33 ? "#ff4d5e" : hp/max <= 0.66 ? "#ffb24d" : "#39d98a"; }

  let html = '';

  // ── Core 行 ──
  if(core){
    const chp = core.hp||0, csh = core.shield||0, cpos = core.pos||[0,0];
    const cmax = 5; // Core 最大 HP
    html += `<div class="ul-section">
      <div class="ul-head">${ICONS.CORE}<span class="name">Core</span>
        <span class="hp-bar" style="min-width:50px;max-width:90px;height:8px;"><span class="hp-fill" style="width:${Math.max(0,(chp/cmax)*100)}%;background:${hpColor(chp,cmax)}"></span></span>
        <span style="font-size:11px;font-weight:700;color:#4cc2ff">盾${csh}</span>
        ${csh>0?'<span class="ul-tag" style="background:rgba(76,194,255,0.2);color:#4cc2ff">驻守</span>':''}
        <span class="ul-pos">[${cpos[0]},${cpos[1]}]</span></div></div>`;
  }

  // ── 各兵种段 ──
  const TYPE_NAMES = { WORKER:"工人", VANGUARD:"先锋", RANGER:"游侠" };
  const TYPE_KEYS = ["WORKER","VANGUARD","RANGER"];
  // 默认展开状态记录
  if(!window._ulExpand) window._ulExpand = { WORKER:true, VANGUARD:true, RANGER:true };

  TYPE_KEYS.forEach(type=>{
    const list = byType[type];
    const name = TYPE_NAMES[type];
    const expanded = window._ulExpand[type];
    html += `<div class="ul-section">
      <div class="ul-head ${expanded?'':'collapsed'}" onclick="_ulToggle('${type}',this)">
        ${ICONS[type]}<span class="name">${name}</span>
        <span class="count">${list.length}</span>
        <span class="chev">▾</span></div>
      <div class="ul-body ${expanded?'':'hidden'}">`;
    list.forEach(u=>{
      const rawUid = u.id||u.uid||"?";
      // 只显示后4位（UUID太长）
      const uid = rawUid.length > 4 ? "…"+rawUid.slice(-4) : rawUid;
      const hp = u.hp||0;
      const maxHp = u.max_hp||5; // 默认最大 HP
      const pos = u.pos||[0,0];
      const tag = u.tag ? tagCN(u.tag) : "";
      const cargo = u.cargo || 0;
      // 工人显示载货量，战斗单位显示动作标签
      const displayTag = type==="WORKER"
        ? (cargo > 0 ? `运载` : (tag||"—"))
        : (tag||"—");
      const tagCol = type==="WORKER" && cargo > 0 ? "#39d98a" : tagColor(u.tag);
      html += `<div class="ul-row">
        <span class="ul-uid">${uid}</span>
        <span class="hp-bar" style="min-width:48px"><span class="hp-fill" style="width:${Math.max(2,(hp/maxHp)*100)}%;background:${hpColor(hp,maxHp)}"></span></span>
        <span class="ul-tag" style="background:${tagCol};color:#04121f">${displayTag}</span>
        <span class="ul-pos">[${pos[0]},${pos[1]}]</span></div>`;
    });
    html += `</div></div>`;
  });

  box.innerHTML = html;
}

  if(body) body.classList.toggle("hidden");

function renderFeed(){
  const feed=document.getElementById("feed"); feed.innerHTML="";
  const f=activeFilters();
  const events=[];
  TICKS.slice(-120).forEach(t=>t.events.forEach(e=>{ if(f[e.type]) events.push({tick:t.tick,e}); }));
  events.slice(-260).forEach(({tick,e})=>{
    const m=EV_META[e.type]||{label:e.type,color:"#8b97ad"};
    const d=document.createElement("div"); d.className="e"; d.style.borderLeftColor=m.color;
    d.innerHTML=`<span style="color:var(--muted)">t${tick}</span> <span class="tag" style="background:${m.color}">${m.label}</span> @(${e.pos[0]},${e.pos[1]}) ${e.detail||""}`;
    feed.appendChild(d);
  });
  feed.scrollTop=feed.scrollHeight;
}

function tick(){
  if(paused) return;
  if(TICKS.length){ draw(); renderStats(); renderFeed();
    const ago=((Date.now()-lastUpdate)/1000).toFixed(1);
    document.getElementById("upd").textContent="更新于 "+ago+"s 前 · "+TICKS.length+" 帧";
  } else if(MAPBASE){   // 分片流未就绪：仍用地图快照渲染，避免整片纯黑
    draw(); renderStats();
    document.getElementById("upd").textContent="地图快照 t"+MAPBASE.tick+"（等待实时分片流…）";
  }
  setTimeout(poll, +document.getElementById("rate").value);
}

async function poll(){
  try{
    // 尝试拉取 shard 索引；index.json 可能不存在（桥接尚未 flush 首个 shard），
    // 此时降级为仅依赖 latest.json（实时帧）+ map.json（地图快照），不中断渲染。
    let urls=[];
    let idx_ok=false;
    try{
      const ir=await fetch(ah_url(INDEX_URL)+"?_="+Date.now());
      if(ir.ok){
        idx_ok=true;
        const idx=await ir.json();
        const min=idx.kept_min??0, max=idx.kept_max??0;
        for(let s=min;s<=max;s++) urls.push(SHARD_GLOB+String(s).padStart(5,"0")+".jsonl");
      }
    }catch(e){}
    // 地图层快照与分片流并行拉取（快照小且原子替换，读到即完整）
    fetch(ah_url(MAP_URL)+"?_="+Date.now()).then(r=>r.ok?r.json():null)
      .then(m=>{ if(m) MAPBASE=m; }).catch(()=>{});
    // 敌方敌情标注（消失点 + 三角定位核心区），每 tick 刷新
    fetch(ah_url(ENEMY_MARKS_URL)+"?_="+Date.now()).then(r=>r.ok?r.json():null)
      .then(m=>{ if(m) ENEMY_MARKS=m; }).catch(()=>{});
    let arr=[];
    if(idx_ok && urls.length){
      const texts=await Promise.all(urls.map(u=>fetch(ah_url(u)+"?_="+Date.now()).then(r=>r.ok?r.text():"").catch(()=>"")));
      let lines=[];
      texts.forEach(t=>{ t.split("\n").filter(l=>l.trim()).forEach(l=>lines.push(l)); });
      arr=lines.map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean);
    }
    // 实时帧：优先用 stream/latest.json（每 tick 写），解决分片流 200 帧缓冲导致的
    // 「地图一直不变 / 快走不更新」。latest 比最后一帧新则替换/追加为实时帧。
    try{
      const lr=await fetch(ah_url("stream/latest.json")+"?_="+Date.now());
      if(lr.ok){ const lj=await lr.json();
        if(lj && lj.tick!=null){
          if(arr.length && arr[arr.length-1].tick >= lj.tick) arr[arr.length-1]=lj;
          else arr.push(lj);
        } }
    }catch(e){}
    if(arr.length){ TICKS=arr.slice(-MAXTICKS); lastUpdate=Date.now(); computeBounds(); }
    document.getElementById("drop").style.display="none";
  }catch(e){
    document.getElementById("drop").style.display="flex";
  }
  tick();
}

}

// 定位Core：回到 Core（冠军信标侧）位置。再次点击关闭跟随。Core 会向信标迁移，
// 所以开启后每帧都把视图中心锁在最新 Core 坐标上（trackCore）。
document.getElementById("zCore").onclick=()=>{
  const last=TICKS[TICKS.length-1];
  if(trackCore){ trackCore=false; document.getElementById("zCore").classList.remove("on"); document.getElementById("zTxt").textContent=zoom.toFixed(2)+"×"; return; }
  if(last && last.core){ trackCore=true; autoFit=false; PAN.x=last.core.pos[0]; PAN.y=last.core.pos[1];
    document.getElementById("zCore").classList.add("on"); computeBounds(); draw(); }
};
// 拖动时关闭跟随，避免与手动平移打架
cv.addEventListener("mousedown",()=>{ if(trackCore){ trackCore=false; document.getElementById("zCore").classList.remove("on"); } });

// 拖动平移：按住拖动移动视图中心（PAN 为世界坐标中心）
let dragging=false, dragStart=null, panStart=null;
function worldFromMouse(mx,my){
  // 鼠标坐标 → 世界坐标（与 sx/sy 互逆）
  const c=autoFit?(BOUNDS.minX+BOUNDS.maxX)/2:PAN.x;
  const cy=autoFit?(BOUNDS.minY+BOUNDS.maxY)/2:PAN.y;
  const s=viewScale();
  const wx=c+(mx-cv.width/2)/s;
  const wy=cy-(my-cv.height/2)/s;
  return [wx,wy];
}
cv.addEventListener("mousedown",e=>{
  dragging=true; cv.classList.add("grabbing");
  autoFit=false; document.getElementById("zTxt").textContent=zoom.toFixed(2)+"×";
  dragStart={x:e.offsetX,y:e.offsetY};
  panStart={x:PAN.x,y:PAN.y};
});
cv.addEventListener("mousemove",e=>{
  if(!dragging) return;
  const s=viewScale();
  const dx=(e.offsetX-dragStart.x)/s;
  const dy=(e.offsetY-dragStart.y)/s;
  PAN.x=panStart.x-dx;   // 鼠标右移 → 视图右移 → 世界中心左移
  PAN.y=panStart.y-dy;   // 鼠标下移 → 视图下移 → 世界中心上移
  draw();
});
window.addEventListener("mouseup",()=>{ if(dragging){dragging=false; cv.classList.remove("grabbing");} });
window.addEventListener("mouseleave",()=>{ if(dragging){dragging=false; cv.classList.remove("grabbing");} });
document.getElementById("file").onchange=e=>{
  const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ const arr=r.result.split("\n").filter(l=>l.trim()).map(l=>{try{return JSON.parse(l)}catch(_){return null}}).filter(Boolean);
    TICKS=arr.slice(-MAXTICKS); lastUpdate=Date.now(); computeBounds(); draw(); renderStats(); renderFeed(); };
  r.readAsText(f);
};

// ===== 实时调参：地图网页滑块 → /api/params → stream/live_params.json =====
// 根据当前启用的决策(legacy=旧 / evolve=新)只显示对应滑块；参数写入 localStorage，
// 刷新页面后即时恢复，并再与服务器 live_params.json 对账（服务器为权威来源）。
const LP_CONFIG = [
  {key:"worker_ratio",       label:"探索单位占比(工人)", min:0.10, max:0.90, step:0.01, def:0.5463523563273454, unit:"", ns:"new"},
  {key:"patrol_radius",       label:"战斗单位活动半径",  min:3,    max:12,   step:0.5,  def:7.5,               unit:"格", ns:"new"},
  {key:"idle_explore_radius", label:"探索距离上限",      min:0,    max:60,   step:1,    def:15,                unit:"格", ns:"new"},
  {key:"scout_search_limit",  label:"探索搜索半径",      min:10,   max:80,   step:1,    def:40,                unit:"格", ns:"new"},
  {key:"revisit_ticks",       label:"重复探索周期",      min:40,   max:400,  step:1,    def:243.23470250665162, unit:"t", ns:"new"},
  {key:"beacon_go_range",     label:"主动远征触发距离",  min:5,    max:45,   step:0.5,  def:15.172532787271086, unit:"格", ns:"new"},
  {key:"defense_radius",      label:"防御敏感度",        min:4,    max:20,   step:0.5,  def:11.0797481548136,   unit:"格", ns:"new"},
];
const LP_OLD_CONFIG = [
  {key:"explorer_base_radius",     label:"基础探索半径",     min:5,  max:40, step:1, def:20, unit:"格", ns:"old"},
  {key:"explorer_max_radius",      label:"探索半径上限",     min:10, max:80, step:1, def:60, unit:"格", ns:"old"},
  {key:"explorer_radius_per_unit", label:"每单位增加半径",   min:0,  max:5,  step:0.5,def:2,  unit:"格", ns:"old"},
  {key:"explorer_home_radius",     label:"探索离家围栏",     min:10, max:80, step:1, def:40, unit:"格", ns:"old"},
];

// 当前决策模式：null=未识别(兜底新决策)，"new"=evolve(新决策)，"old"=legacy(旧决策)
let currentMode = null;
let _lpLastMode = null;
let _lpTimer = null;

function _lpFmt(c, v){
  const n = parseFloat(v);
  const s = c.step < 1 ? n.toFixed(2) : String(Math.round(n));
  return s + (c.unit ? (" " + c.unit) : "");
}
function _lpConfigFor(ns){ return ns === "old" ? LP_OLD_CONFIG : LP_CONFIG; }
function _lpNsLabel(ns){ return ns === "old" ? "旧决策(legacy)" : "新决策(evolve)"; }
function _lpLsKey(ns){ return "ah_lp_" + ns; }

// localStorage 持久化（按命名空间独立保存，刷新即恢复，不依赖服务器往返）
function _lpSave(ns){
  const cfg = _lpConfigFor(ns);
  const obj = {};
  cfg.forEach(c=>{ if(c._inp) obj[c.key] = parseFloat(c._inp.value); });
  try { localStorage.setItem(_lpLsKey(ns), JSON.stringify(obj)); } catch(e){}
}
function _lpRestore(ns){
  let obj = null;
  try { obj = JSON.parse(localStorage.getItem(_lpLsKey(ns)) || "null"); } catch(e){}
  if(!obj) return;
  const cfg = _lpConfigFor(ns);
  cfg.forEach(c=>{ if(obj[c.key] !== undefined && c._inp){ c._inp.value = obj[c.key]; c._val.textContent = _lpFmt(c, obj[c.key]); } });
}

// 根据当前模式构建滑块（只建当前决策的，其它决策不显示）
function _buildActiveSliders(){
  const box = document.getElementById("lpSliders");
  box.innerHTML = "";
  const note = document.getElementById("lpNote");
  const modeEl = document.getElementById("lpMode");
  if(!currentMode){
    // 未识别模式：兜底显示新决策，并提示
    currentMode = "new";
    modeEl.textContent = "未知";
    note.className = "lp-note warn";
    note.textContent = "未识别当前决策模式（.active_agent 缺失），默认显示新决策。运行 switch_agent.sh 后点此按钮可刷新。";
  } else {
    modeEl.textContent = _lpNsLabel(currentMode);
    note.className = "lp-note";
    note.textContent = "下一 tick 即时生效，无需重启 agent；参数自动记录，刷新页面不丢失。";
  }
  const cfg = _lpConfigFor(currentMode);
  cfg.forEach(c=>{
    const row = document.createElement("div");
    row.className = "lp-slrow";
    const lab = document.createElement("label");
    const name = document.createElement("span"); name.textContent = c.label;
    const val = document.createElement("span"); val.className = "v";
    lab.appendChild(name); lab.appendChild(val);
    const inp = document.createElement("input");
    inp.type = "range"; inp.min = c.min; inp.max = c.max; inp.step = c.step; inp.value = c.def;
    row.appendChild(lab); row.appendChild(inp); box.appendChild(row);
    val.textContent = _lpFmt(c, c.def);
    inp.addEventListener("input", ()=>{ val.textContent = _lpFmt(c, inp.value); schedulePushLiveParams(); });
    c._inp = inp; c._val = val;
  });
  _lpRestore(currentMode);   // 1) 先从 localStorage 即时恢复（刷新不丢）
  loadLiveParams();          // 2) 再与服务器对账（服务器为权威来源）
  _lpLastMode = currentMode;
}

function schedulePushLiveParams(){
  clearTimeout(_lpTimer);
  _lpTimer = setTimeout(pushLiveParams, 250);  // 防抖：避免每像素一请求
}
function pushLiveParams(){
  if(!currentMode) return;
  const cfg = _lpConfigFor(currentMode);
  const data = {}; data[currentMode] = {};
  cfg.forEach(c=>{ if(c._inp) data[currentMode][c.key] = parseFloat(c._inp.value); });
  _lpSave(currentMode);   // 立即落盘 localStorage
  const st = document.getElementById("lpStatus");
  st.className = "lp-status"; st.textContent = "发送中…";
  fetch(ah_url("/api/params"), {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)
  })
    .then(r=> r.ok ? r.json() : Promise.reject(new Error("HTTP "+r.status)))
    .then(()=>{ st.className = "lp-status ok"; st.textContent = "已应用 ✓"; })
    .catch(e=>{ st.className = "lp-status err"; st.textContent = "发送失败：" + e.message; });
}
function loadLiveParams(){
  if(!currentMode) return;
  fetch(ah_url("stream/live_params.json") + "?_=" + Date.now())
    .then(r=> r.ok ? r.json() : null)
    .then(j=>{
      if(!j) return;
      const ns = currentMode;
      const src = j[ns];
      if(!src) return;
      const cfg = _lpConfigFor(ns);
      cfg.forEach(c=>{
        const v = src[c.key];
        if(v !== undefined && c._inp){
          c._inp.value = v; c._val.textContent = _lpFmt(c, v);
          // 写回 localStorage，保证刷新后与服务器一致
          try { const o = JSON.parse(localStorage.getItem(_lpLsKey(ns)) || "{}"); o[c.key] = v;
            localStorage.setItem(_lpLsKey(ns), JSON.stringify(o)); } catch(e){}
        }
      });
    })
    .catch(()=>{});
}
function resetLiveParams(){
  if(!currentMode) return;
  const cfg = _lpConfigFor(currentMode);
  const data = {}; data[currentMode] = {};
  cfg.forEach(c=>{ if(c._inp){ c._inp.value = c.def; c._val.textContent = _lpFmt(c, c.def); data[currentMode][c.key] = c.def; } });
  _lpSave(currentMode);
  const st = document.getElementById("lpStatus");
  st.className = "lp-status"; st.textContent = "发送中…";
  fetch(ah_url("/api/params"), {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)
  })
    .then(()=>{ st.className = "lp-status ok"; st.textContent = "已恢复默认 ✓"; })
    .catch(e=>{ st.className = "lp-status err"; st.textContent = "发送失败：" + e.message; });
}

// 展开/收起：点击按钮切换；展开时重新探测决策模式（捕捉 agent 切换）
const lpToggle = document.getElementById("lpToggle");
const lpBody = document.getElementById("lpBody");
lpToggle.addEventListener("click", ()=>{
  const open = lpBody.style.display === "none";
  lpBody.style.display = open ? "block" : "none";
  lpToggle.classList.toggle("open", open);
  if(open) fetchMode();
});
document.getElementById("lpReset").addEventListener("click", resetLiveParams);

// 探测当前决策模式：legacy=旧决策(old) / evolve=新决策(new) / null=未识别
async function fetchMode(){
  try{
    const r = await fetch(ah_url("/api/mode") + "?_=" + Date.now());
    if(r.ok){
      const j = await r.json();
      const ns = j.mode === "legacy" ? "old" : (j.mode === "evolve" ? "new" : null);
      if(ns !== _lpLastMode){
        currentMode = ns;
        _buildActiveSliders();
      }
      return;
    }
  }catch(e){}
  // 探测失败且尚未构建过：兜底构建新决策
  if(_lpLastMode === null){ currentMode = null; _buildActiveSliders(); }
}

fetchMode();          // 初始化：探测模式 → 构建对应滑块
setInterval(fetchMode, 15000);  // 每 15s 复查决策模式（切换 agent 时自动换滑块，仅在变化时重建）
buildFilters();
fitCanvas();
poll();
</script>
